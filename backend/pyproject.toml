[project]
name = "annsetu-backend"
version = "1.0.0"
description = "AnnSetu FastAPI backend: AI document review (Gemini) and chatbot"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "google-auth>=2.30",
  "requests>=2.31",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
